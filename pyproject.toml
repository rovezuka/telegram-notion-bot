[project]
name = "tg-notion-inbox"
version = "0.1.0"
description = "Telegram-бот: любое сообщение становится входящей задачей в Notion"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]